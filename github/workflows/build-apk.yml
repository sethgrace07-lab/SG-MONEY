name: Build SG MONEY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet Android
        run: |
          flutter create --platforms=android --project-name=sg_money .
      
      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze

      - name: Construire l’APK
        run: flutter build apk --release

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-MONEY-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

### 4. Enregistre le fichier

Appuie sur **Commit changes**, puis confirme.

Ce workflow doit préparer la structure Android manquante et lancer la compilation. Il n’est pas encore garanti que la compilation réussisse : nous vérifierons les résultats dans GitHub Actions.

**Quand tu as enregistré le fichier, réponds simplement : « C’est enregistré ».**

Ensuite, je te guiderai pour lancer la compilation et récupérer l’APK de SG MONEY.
